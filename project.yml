name: CotoveleiraInteligente
options:
  bundleIdPrefix: br.edu.tcc
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  CotoveleiraInteligente:
    type: application
    platform: iOS
    sources: [Cotoveleira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.edu.tcc.cotoveleira
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Cotoveleira/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO

  CotoveleiraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: CotoveleiraInteligente
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CotoveleiraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: CotoveleiraInteligente
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CotoveleiraInteligente:
    build:
      targets:
        CotoveleiraInteligente: all
    test:
      targets:
        - CotoveleiraTests
        - CotoveleiraUITests
